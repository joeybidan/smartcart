<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header class="topbar">
    
    <a href="index.html" class="logo">
    <div class="brand-title">
        🛒 SmartCart™
    </a>

    <div class="brand-subtitle">
        by JoeyB™
    </div>

    <a href="cart.html"
class="cart-badge"
id="cartBadge">
        🛒 Cart (0)
    </a>

</div>


</header>

<main>

    <section class="card">

        <h3>Current Cart</h3>

        <div id="cartItems">

            Loading...

        </div>

    </section>

    <section class="card">

        <h3>Total</h3>

        <div class="cart-total">

            $<span id="cartTotal">0.00</span>

        </div>

        <button
            class="checkout-btn"
            onclick="checkout()">

            Checkout

        </button>


        


        <button

class="empty-cart-btn"

onclick="emptyCart()">

🗑 Empty Cart

</button>

    </section>

</main>

<script src="../js/app.js"></script>
<script src="../js/cart.js"></script>

</body>

</html>
