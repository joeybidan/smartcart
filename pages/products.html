<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Products</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header class="topbar">
    
    <a href="index.html" class="logo">
    <div class="brand-title">
        📦 SmartCart™
    </div>

    <div class="brand-subtitle">
        by JoeyB™
    </div>



</a>

<a
href="cart.html"
class="cart-badge"
id="cartBadge">

🛒 Cart (0)

</a>

</header>

<main>

    <section class="card">

        <h3>Add Product</h3>

        <input
            id="barcode"
            class="form-input"
            placeholder="Barcode">

        <input
            id="productName"
            class="form-input"
            placeholder="Product Name">

        <input
            id="category"
            class="form-input"
            placeholder="Category">

        <input
            id="price"
            class="form-input"
            type="number"
            step="0.01"
            placeholder="Price">

        <button
            class="scan-btn"
            onclick="saveProduct()">

            Save Product

        </button>

    </section>

    <section class="card">

        <h3>Products</h3>

        <div id="productsList">

        </div>

    </section>

<div id="toast"></div>


</main>

<script src="../js/app.js"></script>
<script src="../js/products.js"></script>

</body>

</html>
