<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Barcode Scanner</title>

<link rel="stylesheet"
      href="../css/style.css">

</head>

<body>

<header class="topbar">

    <a href="index.html" class="logo">

        <div class="brand-title">
            📷 SmartCart™
        </div>

        <div class="brand-subtitle">
            by JoeyB™
        </div>


</a>

<a
href="cart.html"
class="cart-badge"
id="cartBadge">

🛒 Cart (0)

</a>

</header>

<main>

    <section class="card">

        <h3>Barcode Scanner</h3>

        <video
            id="scannerVideo"
            class="scanner-video"
            autoplay
            playsinline>
        </video>

        <button
            class="scan-btn"
            onclick="startScanner()">

            Start Scanner

        </button>

    </section>

<section class="card">

    <h3>Last Scan</h3>

    <div id="scanResult">

        No barcode scanned yet

    </div>

</section>

<section
    class="card"
    id="unknownProductCard"
    style="display:none;">

    <h3>Unknown Product</h3>

    <input
        id="unknownBarcode"
        class="form-input"
        placeholder="Barcode"
        readonly>

    <input
        id="unknownName"
        class="form-input"
        placeholder="Product Name">

    <input
        id="unknownCategory"
        class="form-input"
        placeholder="Category">

    <input
        id="unknownPrice"
        class="form-input"
        type="number"
        step="0.01"
        placeholder="Price">

    <button
        class="scan-btn"
        onclick="saveUnknownProduct()">

        Save Product

    </button>

</section>

</main>

<footer class="footer">

    Email me:

    <a href="mailto:businesssjoey.bidan@gmail.com">
        businesssjoey.bidan@gmail.com
    </a>

</footer>

<script src="https://unpkg.com/@zxing/library@latest"></script>

<script src="../js/app.js"></script>
<script src="../js/scanner.js"></script>

</body>
</html>
